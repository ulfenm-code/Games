<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plastlabyrinten</title>
<link rel="stylesheet" href="fpa_style_07.css">
</head>
<body>
<div id="hud">Luta telefonen</div>
<div id="hint"></div>
<div id="tilt" class="hide">📱</div>
<button id="mapBtn" class="hide" aria-label="Zooma ut och se kuben utifrån" title="Zooma ut och se kuben (M)">🧊</button>
<div id="gearR" class="gear vert hide" aria-label="Vrid kuben framåt eller bakåt"><div class="teeth"></div></div>
<div id="gearB" class="gear horiz hide" aria-label="Vrid kuben åt vänster eller höger"><div class="teeth"></div></div>
<div id="gearTip" class="hide"></div>
<button id="holesBtn" class="hide">Visa alla hål</button>
<div id="dbg" class="hide" style="position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-family:monospace;font-size:12px;opacity:.6;white-space:pre"></div>

<div class="ov" id="start">
  <h1>Plastlabyrinten</h1>
  <p>Hamstern är fångad i en kub. Rullar den i ett hål fastnar den halvvägs, och då vrider du kuben med kugghjulen. Står den under ett schakt kan du vända kuben så att den faller ner i det. Hitta utgången på kubens yta.</p>
  <button id="go">Börja</button>
  <button class="ghost" id="nomotion">Jag har ingen lutningssensor</button>
  <p id="diag" style="font-family:monospace;font-size:12px;opacity:.75;white-space:pre-line;max-width:34ch;text-align:left;margin-top:6px"></p>
</div>
<div class="ov hide" id="win">
  <h1>I mål!</h1>
  <p id="timeText"></p>
  <button onclick="location.reload()">Spela igen</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="fpa_game_07.js"></script>
</body>
</html>
