name: Build Castle Duel v67 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_castle_v67_once.yml'
      - '.github/v67_welcome/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct approved welcome image
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v67_welcome/part*.b64 | base64 -d > Castle/castle_welcome_67.jpg
          test "$(wc -c < Castle/castle_welcome_67.jpg)" -eq 47793
          test "$(git hash-object Castle/castle_welcome_67.jpg)" = "6b50f2ad1598d9a111d15d96dc704cb76b7e99f0"
          file Castle/castle_welcome_67.jpg | grep -qi 'JPEG image data'

      - name: Build v67 from v66
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Castle/castle_index_67.html
          test ! -e Castle/castle_game_67.js
          test ! -e Castle/castle_bot_67.js
          test ! -e Castle/castle_manifest_67.webmanifest

          cp Castle/castle_index_66.html Castle/castle_index_67.html
          cp Castle/castle_game_66.js Castle/castle_game_67.js
          cp Castle/castle_bot_66.js Castle/castle_bot_67.js
          cp Castle/castle_manifest_66.webmanifest Castle/castle_manifest_67.webmanifest

          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'Castle/castle_index_67.html': [
                  ('castle_manifest_66.webmanifest','castle_manifest_67.webmanifest'),
                  ('Castle Duel v66','Castle Duel v67'),
                  ('castle_welcome_66.jpg','castle_welcome_67.jpg'),
                  ('castle_bot_66.js','castle_bot_67.js'),
                  ('castle_game_66.js','castle_game_67.js'),
              ],
              'Castle/castle_game_67.js': [
                  ('CastleBot66','CastleBot67'),
                  ('castle_index_66.html','castle_index_67.html'),
              ],
              'Castle/castle_bot_67.js': [
                  ('Castle Duel v66','Castle Duel v67'),
                  ('CastleBot66','CastleBot67'),
              ],
              'Castle/castle_manifest_67.webmanifest': [
                  ('castle_index_66.html','castle_index_67.html'),
              ],
          }
          for name, reps in replacements.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              for old,new in reps:
                  if old not in s:
                      raise SystemExit(f'Missing expected token {old!r} in {name}')
                  s = s.replace(old,new)
              p.write_text(s, encoding='utf-8')

          checks = {
              'Castle/castle_index_67.html': ['castle_manifest_67.webmanifest','Castle Duel v67','castle_welcome_67.jpg','castle_bot_67.js','castle_game_67.js'],
              'Castle/castle_game_67.js': ['CastleBot67','castle_index_67.html'],
              'Castle/castle_bot_67.js': ['Castle Duel v67','CastleBot67'],
              'Castle/castle_manifest_67.webmanifest': ['castle_index_67.html'],
          }
          stale = ['castle_index_66.html','castle_game_66.js','castle_bot_66.js','castle_manifest_66.webmanifest','castle_welcome_66.jpg','CastleBot66']
          for name,tokens in checks.items():
              s=Path(name).read_text(encoding='utf-8')
              for token in tokens:
                  if token not in s:
                      raise SystemExit(f'v67 validation failed: {token} missing from {name}')
              for old in stale:
                  if old in s:
                      raise SystemExit(f'v67 validation failed: stale runtime reference {old} in {name}')
          PY

          node --check Castle/castle_game_67.js
          node --check Castle/castle_bot_67.js

      - name: Commit v67
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Castle/castle_index_67.html Castle/castle_game_67.js Castle/castle_bot_67.js Castle/castle_manifest_67.webmanifest Castle/castle_welcome_67.jpg
          git commit -m 'Add Castle Duel v67 with verified welcome image'
          git push
