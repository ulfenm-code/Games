async function rest(path,opts={}){const h={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json',Prefer:'return=representation',...(opts.headers||{})};const r=await fetch(SUPA_URL+'/rest/v1/'+path,{...opts,headers:h});const txt=await r.text();if(!r.ok)throw new Error(txt||r.statusText);return txt?JSON.parse(txt):null}
function code4(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let x='';crypto.getRandomValues(new Uint32Array(4)).forEach(n=>x+=chars[n%chars.length]);return x}
async function createOnlineMatch(){for(let tries=0;tries<8;tries++){const code=code4();try{const rows=await rest('matches',{method:'POST',body:JSON.stringify({code,status:'waiting',join_status:'waiting',player1_name:names[0],player2_name:null,current_player:1,turn_no:1})});matchId=rows[0].id;matchCode=code;netmsg('online • match '+code);return}catch(e){if(!String(e).includes('duplicate'))throw e}}throw new Error('Kunde inte skapa matchkod')}
async function saveShot(player,vx,vy,weapon){if(!matchId)return;const power=Math.hypot(vx,vy),angle=Math.atan2(-vy,player===1?vx:-vx)*180/Math.PI;await rest('shots',{method:'POST',body:JSON.stringify({match_id:matchId,turn_no:serverTurnNo,player,vx,vy,power,angle,weapon})})}
async function setServerTurn(p,n){if(!matchId)return;await rest('matches?id=eq.'+encodeURIComponent(matchId),{method:'PATCH',body:JSON.stringify({current_player:p,turn_no:n,updated_at:new Date().toISOString()})})}
const A=[{x:190,y:615},{x:1410,y:615}],q={x:190,y:615,vx:0,vy:0,r:18,fly:false,shotTime:0};
const weaponFiles={arrow:'Arrow.png',cannonball:'CanonBall.png',bomb:'Bomb.png',rocket:'Rocket.png'},weaponLabels={arrow:'PIL',cannonball:'KANONKULA',bomb:'BOMB',rocket:'RAKET'};

async function waitForJoin(){clearInterval(joinPoll);showJoin('Match '+matchCode,'Väntar på Player 2…','<button id="smsInvite">Bjud in via SMS</button>');document.getElementById('smsInvite').onclick=inviteSms;joinPoll=setInterval(async()=>{try{const m=await getMatch();if(m&&m.join_status==='requested'){clearInterval(joinPoll);pendingP2=m.player2_name||'Player 2';showJoin(pendingP2+' vill spela!','Vill du släppa in spelaren?','<button id="acceptP2">Acceptera</button><button id="rejectP2">Neka</button>');document.getElementById('acceptP2').onclick=acceptJoin;document.getElementById('rejectP2').onclick=rejectJoin}}catch(e){netmsg('online • väntar på anslutning')}},800)}
function inviteSms(){const inviteUrl='https://ulfenm-code.github.io/Games/Castle/castle_index_37.html?match='+encodeURIComponent(matchCode);const msg=(names[0]||'Player 1')+' vill spela Castle Duel med dig!\n\nTryck på länken för att gå med:\n\n'+inviteUrl;const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent);const sep=isiOS?'&':'?';window.location.href='sms:'+sep+'body='+encodeURIComponent(msg)}
async function acceptJoin(){try{await rest('matches?id=eq.'+encodeURIComponent(matchId),{method:'PATCH',body:JSON.stringify({join_status:'accepted',status:'playing',accepted_at:null,player2_joined_at:null})});names[1]=pendingP2||'Player 2';deviceRole=1;startGameSync();netmsg('online • match '+matchCode);showStartButton()}catch(e){netmsg('accept-fel')}}

function waitForBothReady(){clearInterval(readyPoll);const check=async()=>{try{const m=await getMatch();if(m&&m.accepted_at&&m.player2_joined_at){clearInterval(readyPoll);if(!countdownStarted){countdownStarted=true;hideJoin();beginCountdown()}}}catch(e){netmsg('online • väntar på andra spelaren')}};check();readyPoll=setInterval(check,250)}
function beginCountdown(){const cd=document.getElementById('countdown'),num=document.getElementById('countNum');cd.style.display='flex';let t0=performance.now();const tick=now=>{let remain=Math.max(0,5-Math.floor((now-t0)/1000));if(remain>0){num.textContent=remain;requestAnimationFrame(tick)}else{cd.style.display='none';started=true;turn=0;timeLeft=TURN_SECONDS;last=performance.now();startPlacement()}};requestAnimationFrame(tick)}
function fit(){let s=Math.min(innerWidth/VW,innerHeight/VH);wrap.style.width=VW*s+'px';wrap.style.height=VH*s+'px'}
function anchor(){return A[turn]}function resetShot(){let a=anchor();q.x=a.x;q.y=a.y;q.vx=q.vy=0;q.fly=false;q.shotTime=0;physAcc=0}
function applyServerTurn(player,no){
  const nt=Number(player)-1,nn=Number(no);
  if(nn<serverTurnNo)return;
  const changed=nn!==serverTurnNo||nt!==turn;
  serverTurnNo=nn;turn=nt;
  if(changed){timeLeft=TURN_SECONDS;paused=false;drag=false;resetShot()}
  netmsg(deviceRole===turn+1?'STRIDSFAS • din tur • '+weaponLabels[selectedWeapon]:'STRIDSFAS • väntar på '+names[turn])
}
async function advanceAfterShot(){
  if(deviceRole!==flyingShooter)return;
  const nextPlayer=flyingShooter===1?2:1,nextNo=serverTurnNo+1;
  drag=false;resetShot();
  try{await setServerTurn(nextPlayer,nextNo);applyServerTurn(nextPlayer,nextNo)}
  catch(e){netmsg('turbyte väntar på servern')}
}
async function advanceAfterTimeout(){
  if(deviceRole!==turn+1)return;
  const nextPlayer=turn===0?2:1,nextNo=serverTurnNo+1;
  drag=false;resetShot();
  try{await setServerTurn(nextPlayer,nextNo);applyServerTurn(nextPlayer,nextNo)}
  catch(e){netmsg('turbyte väntar på servern')}
}
function startGameSync(){clearInterval(gamePoll);gamePoll=setInterval(async()=>{
  if(gamePhase!=='battle'||!matchId||!started)return;
  try{
    await loadBattlePlacements();
    const m=await getMatch();
    if(m){
      if(m.player1_name)names[0]=m.player1_name;
      if(m.player2_name)names[1]=m.player2_name;
      const dbPlayer=Number(m.current_player||1),dbNo=Number(m.turn_no||1);
      if(!q.fly)applyServerTurn(dbPlayer,dbNo);else if(dbNo>serverTurnNo){q.fly=false;physAcc=0;bombDetonating=false;applyServerTurn(dbPlayer,dbNo)}
    }
    const boomRows=await rest('shots?match_id=eq.'+encodeURIComponent(matchId)+'&turn_no=eq.'+serverTurnNo+'&weapon=eq.bomb_exploded&select=turn_no,player,vx,vy,weapon',{method:'GET'});
    if(boomRows&&boomRows.length){
      const boom=boomRows[0],key=boom.turn_no+':'+boom.player;
      if(Number(boom.player)!==deviceRole&&key!==lastBombExplosionKey){
        lastBombExplosionKey=key;
        await showBombExplosion(Number(boom.vx),Number(boom.vy),Number(boom.player),false);
      }
    }
    const balloonRows=await rest('shots?match_id=eq.'+encodeURIComponent(matchId)+'&turn_no=eq.'+serverTurnNo+'&weapon=like.balloon_hit_%25&select=turn_no,player,power,angle,weapon',{method:'GET'});
    if(balloonRows&&balloonRows.length)for(const ev of balloonRows){const key=ev.turn_no+':'+ev.player+':'+ev.weapon;if(key!==lastBalloonEventKey){lastBalloonEventKey=key;const parts=String(ev.weapon).split('_'),owner=Number(parts[2]),id=parts[3]+'-'+parts[4],reward=parts[5]||'none';showBalloonHit(owner,id,Number(ev.power),Number(ev.angle),reward,Number(ev.player),true)}}
    const castleRows=await rest('shots?match_id=eq.'+encodeURIComponent(matchId)+'&weapon=like.castle_attack_%25&select=player,vx,vy,power,weapon',{method:'GET'});
    if(castleRows&&castleRows.length)for(const ev of castleRows){
      const key=String(ev.weapon);
      if(lastCastleEventKeys.has(key))continue;
      lastCastleEventKeys.add(key);
      const parts=key.split('_'),owner=Number(parts[2]),id=parts[3]+'-'+parts[4],target=Number(ev.power);
      if(owner!==deviceRole)launchCastleBomb(owner,id,target,Number(ev.vx),Number(ev.vy)+BALLOON_H*.28);
    }
    const shots=await rest('shots?match_id=eq.'+encodeURIComponent(matchId)+'&turn_no=gt.'+lastSeenTurnNo+'&select=turn_no,player,vx,vy,power,angle,weapon&order=turn_no.asc',{method:'GET'});
    if(shots&&shots.length)for(const sh of shots){
      lastSeenTurnNo=Math.max(lastSeenTurnNo,Number(sh.turn_no)||0);
      const shotNo=Number(sh.turn_no),shotPlayer=Number(sh.player);
      if(String(sh.weapon||'').startsWith('balloon_hit_')){
        const parts=String(sh.weapon).split('_'),owner=Number(parts[2]),id=parts[3]+'-'+parts[4],reward=parts[5]||'none',key=shotNo+':'+shotPlayer+':'+sh.weapon;
        if(key!==lastBalloonEventKey){lastBalloonEventKey=key;showBalloonHit(owner,id,Number(sh.power),Number(sh.angle),reward,shotPlayer,true)}

  }catch(e){netmsg('online • synkroniserar')}
},250)}
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*VW/r.width,y:(e.clientY-r.top)*VH/r.height}}
function barRect(i){return i===0?{x:245,y:35,w:430,h:82}:{x:925,y:35,w:430,h:82}}function hit(r,p){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h}

async function savePlacements(){if(!matchId||placements.length!==4)return;await rest('placements?match_id=eq.'+encodeURIComponent(matchId)+'&player=eq.'+deviceRole,{method:'DELETE'});await rest('placements',{method:'POST',body:JSON.stringify(placements.map((o,i)=>({match_id:matchId,player:deviceRole,object_no:i,object_name:targetNames[i],x:o.x,y:o.y,destroyed:false})))})}

let battlePlacements={1:[],2:[]},lastDestroyed=new Set(),impact=null,explosion=null,bombDetonating=false;
async function loadBattlePlacements(){
  if(!matchId)return;
  const rows=await rest('placements?match_id=eq.'+encodeURIComponent(matchId)+'&select=player,object_no,object_name,x,y,destroyed&order=player.asc,object_no.asc',{method:'GET'});
  let bp={1:[],2:[]};
  (rows||[]).forEach(r=>{let p=Number(r.player);if(bp[p])bp[p].push({n:Number(r.object_no),name:r.object_name,x:Number(r.x),y:Number(r.y),destroyed:!!r.destroyed,b:0})});
  // Detect newly destroyed own objects so the owner sees the hit effect at the correct position.
  if(gamePhase==='battle'&&deviceRole){
    for(const o of bp[deviceRole]){
      const key=deviceRole+':'+o.n;
      if(o.destroyed&&!lastDestroyed.has(key)){
        impact={x:o.x,y:o.y,t:0,kind:'hit'};
        lastDestroyed.add(key);
      }
    }
  }
  battlePlacements=bp;
}
function targetBox(o){
  let im=targetImgs[o.n],w=75,h=75;
  if(im&&im.complete&&im.naturalWidth&&im.naturalHeight){
    let sc=Math.min(75/im.naturalWidth,75/im.naturalHeight);w=im.naturalWidth*sc;h=im.naturalHeight*sc;
  }
  return{x:o.x-w*.575,y:o.y-h*.575,w:w*1.15,h:h*1.15};
}
function projectileTargetHit(){
  const opponent=flyingShooter===1?2:1;
  for(const o of battlePlacements[opponent]||[]){
    if(o.destroyed)continue;
    const b=targetBox(o),r=q.r;
    if(q.x+r>=b.x&&q.x-r<=b.x+b.w&&q.y+r>=b.y&&q.y-r<=b.y+b.h)return o;
  }
  return null;
}
function cannonballTargetHit(){return flyingWeapon==='cannonball'?projectileTargetHit():null}
function bombSpriteRadius(){
  const im=weaponImgs.bomb;
  if(im&&im.complete&&im.naturalWidth&&im.naturalHeight){
    const sc=Math.min(54/im.naturalWidth,54/im.naturalHeight);
    return Math.max(im.naturalWidth*sc,im.naturalHeight*sc)/2;
  }
  return 27;
}
function bombBlastHits(x,y,r){
  const opponent=flyingShooter===1?2:1,hits=[];
  for(const o of battlePlacements[opponent]||[]){
    if(o.destroyed)continue;
    const b=targetBox(o),cx=Math.max(b.x,Math.min(x,b.x+b.w)),cy=Math.max(b.y,Math.min(y,b.y+b.h));
    if(Math.hypot(x-cx,y-cy)<=r)hits.push(o);
  }
  return hits;
}
async function showBombExplosion(x,y,shooter,writeResult){

  if(writeResult){
    try{await rest('shots?match_id=eq.'+encodeURIComponent(matchId)+'&turn_no=eq.'+serverTurnNo+'&player=eq.'+shooter,{method:'PATCH',body:JSON.stringify({weapon:'bomb_exploded',vx:x,vy:y})})}catch(e){netmsg('bombsynk väntar på servern')}
    const opponent=shooter===1?2:1;
    for(const o of hits){
      o.destroyed=true;
      try{await rest('placements?match_id=eq.'+encodeURIComponent(matchId)+'&player=eq.'+opponent+'&object_no=eq.'+o.n,{method:'PATCH',body:JSON.stringify({destroyed:true})})}
      catch(e){netmsg('TRÄFF • väntar på databassynk')}

  setTimeout(()=>{
    if(hits.length)impact={x,y,t:0,kind:'hit'};
    bombDetonating=false;
    if(writeResult)setTimeout(()=>advanceAfterShot(),hits.length?420:80);
  },620);
}

}

const targetImgs=targetFiles.map(f=>{let im=new Image();im.src=f;return im});let gamePhase='waiting',placementIndex=0,placements=[],smoke=null;

function update(dt){if(!started)return;if(gamePhase==='placement'){if(q.fly){physAcc+=dt;let n=0;while(q.fly&&physAcc>=PHYS_STEP&&n<12){physAcc-=PHYS_STEP;q.vy+=cfg.g*PHYS_STEP;let ox=q.x,oy=q.y;q.x+=q.vx*PHYS_STEP;q.y+=q.vy*PHYS_STEP;n++;let floorY=placementFloorY();if(oy<floorY&&q.y>=floorY){let t=(floorY-oy)/(q.y-oy||1),cx=ox+(q.x-ox)*t;q.x=cx;q.y=floorY;lockPlacement(cx,floorY);break}let crossed=deviceRole===1?(ox<VW/2&&q.x>=VW/2):(ox>VW/2&&q.x<=VW/2);if(crossed){let t=(VW/2-ox)/(q.x-ox||1),cy=oy+(q.y-oy)*t;q.x=VW/2;q.y=Math.min(cy,floorY);lockPlacement(VW/2,q.y);break}if(q.x<-50||q.x>VW+50||q.y>VH+100){resetPlacementBall();break}}}return}if(gamePhase!=='battle')return;updateCastleBombs(dt);if(paused||gameOverWinner)return;if(!q.fly){if(deviceRole===turn+1){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;advanceAfterTimeout()}}}else{physAcc+=dt;let n=0;while(q.fly&&physAcc>=PHYS_STEP&&n<12){physAcc-=PHYS_STEP;if(!stepBattle())break;n++}}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,Math.max(0,w),h,r)}
function drawBar(i){let r=barRect(i),active=i===turn;ctx.fillStyle='rgba(83,49,20,.94)';rr(r.x,r.y,r.w,r.h,16);ctx.fill();ctx.strokeStyle=active?'#ffd44c':'#a9783c';ctx.lineWidth=active?5:3;ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 25px system-ui';ctx.textAlign='left';ctx.fillText(names[i],r.x+18,r.y+31);let bx=r.x+18,by=r.y+48,bw=r.w-100,bh=18;ctx.fillStyle='#171717';rr(bx,by,bw,bh,9);ctx.fill();let f=i===turn?Math.max(0,timeLeft/TURN_SECONDS):1;ctx.fillStyle=i===0?'#e83b3b':'#2ca4ef';rr(bx,by,bw*f,bh,9);ctx.fill();ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='900 23px system-ui';ctx.fillText(i===turn?Math.ceil(timeLeft)+'s':TURN_SECONDS+'s',r.x+r.w-18,r.y+65);if(active){ctx.font='900 27px system-ui';ctx.fillText(paused?'▶':'Ⅱ',r.x+r.w-17,r.y+32)}}
function trajectory(){if(!drag)return;let a=gamePhase==='placement'?placementAnchor():anchor(),vx=(a.x-q.x)*cfg.power,vy=(a.y-q.y)*cfg.power;ctx.fillStyle='#fff';for(let i=1;i<30;i++){let t=i*.055,x=a.x+vx*t,y=a.y+vy*t+(gamePhase==='battle'&&selectedWeapon==='rocket'?0:.5*cfg.g*t*t);if(x<0||x>VW||y>cfg.ground)break;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()}}
function drawMagicBall(){let g=ctx.createRadialGradient(q.x-8,q.y-9,2,q.x,q.y,25);g.addColorStop(0,'#fff');g.addColorStop(.25,'#dffaff');g.addColorStop(.65,'#39aaff');g.addColorStop(1,'#173da8');ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,25,0,Math.PI*2);ctx.fill()}
function drawSmoke(){if(!smoke)return;smoke.t+=.035;let al=1-smoke.t,r=35+smoke.t*100;ctx.save();ctx.globalAlpha=Math.max(0,al);ctx.fillStyle='#fff';for(let k=0;k<7;k++){let an=k*6.28/7;ctx.beginPath();ctx.arc(smoke.x+Math.cos(an)*r*.3,smoke.y+Math.sin(an)*r*.25,r*.3,0,6.28);ctx.fill()}ctx.restore();if(smoke.t>=1)smoke=null}
function drawTarget(o){if(o.destroyed)return;let im=targetImgs[o.n];if(!im.complete||!im.naturalWidth)return;let grow=o.b?Math.min(1,(performance.now()-o.b)/350):1,max=75,scale=Math.min(max/im.naturalWidth,max/im.naturalHeight)*grow,w=im.naturalWidth*scale,h=im.naturalHeight*scale;ctx.drawImage(im,o.x-w/2,o.y-h/2,w,h)}
function drawExplosion(){if(!explosion)return;explosion.t+=.055;let p=Math.min(1,explosion.t),r=explosion.r*p;ctx.save();ctx.translate(explosion.x,explosion.y);ctx.globalAlpha=Math.max(0,1-p*.82);let g=ctx.createRadialGradient(0,0,0,0,0,Math.max(1,r));g.addColorStop(0,'rgba(255,255,220,1)');g.addColorStop(.22,'rgba(255,220,70,.98)');g.addColorStop(.55,'rgba(255,105,20,.88)');g.addColorStop(.82,'rgba(90,35,20,.48)');g.addColorStop(1,'rgba(35,35,35,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,225,120,.9)';ctx.lineWidth=Math.max(2,8*(1-p));ctx.beginPath();ctx.arc(0,0,r*.88,0,Math.PI*2);ctx.stroke();for(let i=0;i<14;i++){let a=i*Math.PI*2/14+.35,rp=r*(.45+.45*((i%4)/3));ctx.fillStyle=i%2?'rgba(255,170,45,.85)':'rgba(80,70,65,.65)';ctx.beginPath();ctx.arc(Math.cos(a)*rp,Math.sin(a)*rp,5+13*p,0,Math.PI*2);ctx.fill()}ctx.restore();if(explosion.t>=1)explosion=null}
function drawImpact(){if(!impact)return;impact.t+=.045;let t=impact.t;ctx.save();if(impact.kind==='ground'){ctx.globalAlpha=Math.max(0,1-t);ctx.fillStyle='rgba(225,220,205,.9)';for(let i=0;i<6;i++){let a=i*1.047,r=12+t*45;ctx.beginPath();ctx.arc(impact.x+Math.cos(a)*r*.45,impact.y-4-Math.abs(Math.sin(a))*r*.3,8+t*13,0,6.28);ctx.fill()}}else{let fade=Math.max(0,1-t);ctx.globalAlpha=fade;ctx.translate(impact.x,impact.y);ctx.strokeStyle='#ffd45c';ctx.lineWidth=5;for(let i=0;i<10;i++){let a=i*.628,len=22+t*52;ctx.beginPath();ctx.moveTo(Math.cos(a)*8,Math.sin(a)*8);ctx.lineTo(Math.cos(a)*len,Math.sin(a)*len);ctx.stroke()}ctx.fillStyle='rgba(255,190,55,.95)';ctx.beginPath();ctx.arc(0,0,28+t*18,0,6.28);ctx.fill();ctx.fillStyle='rgba(235,235,230,.75)';for(let i=0;i<5;i++){let a=i*1.256,r=22+t*45;ctx.beginPath();ctx.arc(Math.cos(a)*r*.45,-5+Math.sin(a)*r*.3,9+t*10,0,6.28);ctx.fill()}}ctx.restore();if(t>=1)impact=null}
function draw(){ctx.clearRect(0,0,VW,VH);if(bg.complete)ctx.drawImage(bg,0,0,VW,VH);if(gamePhase==='placement'||gamePhase==='placementDone'){placements.forEach(drawTarget);if(gamePhase==='placement'){trajectory();drawMagicBall();ctx.fillStyle='#fff';ctx.font='900 28px system-ui';ctx.textAlign='center';ctx.fillText('FAS 1 • '+targetNames[placementIndex]+' • Skjut kulan och tryck under flykten',VW/2,55)}drawSmoke();return}drawBar(0);drawBar(1);drawCastleDamage();drawCastleSmoke();drawBalloons();drawCastleBombs();if(gamePhase==='battle'){ctx.save();ctx.globalAlpha=.32;ctx.filter='grayscale(1)';(battlePlacements[deviceRole]||[]).filter(o=>!o.destroyed).forEach(drawTarget);ctx.restore()}trajectory();if(q.fly||!impact)drawProjectile();drawWeaponDock();drawExplosion();drawImpact();drawRewardFly();drawGameOver()}
function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
async function landscape(){try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch(e){}try{if(screen.orientation?.lock)await screen.orientation.lock('landscape')}catch(e){}setTimeout(fit,150)}
form.addEventListener('submit',async e=>{e.preventDefault();names=[p1.value.trim()||'Player 1','Player 2'];deviceRole=1;setup.style.display='none';try{netmsg('skapar match…');await createOnlineMatch();await waitForJoin()}catch(err){netmsg('offline-läge')}})
async function joinFromInvite(code,name){try{showJoin('Ansluter…','Skickar förfrågan till Player 1');const rows=await rest('matches?code=eq.'+encodeURIComponent(code)+'&join_status=eq.waiting&select=id,code,player1_name',{method:'GET'});if(!rows||!rows.length)throw new Error('Matchen finns inte eller är upptagen');matchId=rows[0].id;matchCode=rows[0].code;names[0]=rows[0].player1_name||'Player 1';names[1]=name;deviceRole=2;await rest('matches?id=eq.'+encodeURIComponent(matchId),{method:'PATCH',body:JSON.stringify({player2_name:name,join_status:'requested',player2_joined_at:new Date().toISOString()})});netmsg('online • match '+matchCode);showJoin('Förfrågan skickad','Väntar på att '+names[0]+' accepterar…');clearInterval(joinPoll);joinPoll=setInterval(async()=>{try{const m=await getMatch();if(m&&m.join_status==='accepted'){clearInterval(joinPoll);startGameSync();netmsg('online • match '+matchCode);showStartButton()}else if(m&&m.join_status==='waiting'){clearInterval(joinPoll);showJoin('Nekad','Player 1 nekade förfrågan.')}}catch(e){}},600)}catch(e){showJoin('Kunde inte ansluta','Kontrollera länken eller be Player 1 skapa en ny match.')}}
function inviteLanding(){const code=(new URLSearchParams(location.search).get('match')||'').trim().toUpperCase();if(!code)return;setup.style.display='none';showJoin('Du är inbjuden','Matchkod '+code,'<input id="inviteName" maxlength="18" placeholder="Ditt namn"><br><button id="joinInvite">Gå med i spelet</button>');document.getElementById('joinInvite').onclick=async()=>{await landscape();joinFromInvite(code,document.getElementById('inviteName').value.trim()||'Player 2')}}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,150));fit();resetShot();inviteLanding();requestAnimationFrame(loop);
</script></body></html>
