<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Castle Duel v18</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101722;font-family:system-ui;color:#fff;touch-action:none}canvas{width:100%;height:100%;display:block;background:url('castle_bg.jpg') center/cover no-repeat}#hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#000b;padding:9px 16px;border-radius:14px;font-weight:900;text-align:center}#done{display:none;position:fixed;inset:0;background:#0009;place-items:center}.card{background:#f0d6a4;color:#24170d;border:4px solid #79501f;border-radius:18px;padding:22px;text-align:center}button{font:900 18px system-ui;padding:11px 18px;border-radius:12px;border:2px solid #5b3d13;background:#299a34;color:white}</style></head><body><canvas id="game" width="1600" height="900"></canvas><div id="hud">FAS 1 • DRAKE • dra bakåt och släpp</div><div id="done"><div class="card"><h2>Alla fyra objekt är utplacerade</h2><p>Dina positioner är klara.</p><button id="battle">STARTA STRIDSFASEN</button></div></div><script>const c=document.getElementById('game'),x=c.getContext('2d'),hud=document.getElementById('hud');const names=['DRAKE','FLYGANDE KANON','MAGISK KRISTALL','BOMBTUNNA'],icons=['🐉','💥','💎','🛢️'];let i=0,drag=false,fly=false,last=performance.now(),placed=[];let q={x:190,y:620,vx:0,vy:0};const a={x:190,y:620};function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*1600/r.width,y:(e.clientY-r.top)*900/r.height}}function reset(){q={x:a.x,y:a.y,vx:0,vy:0};fly=false;hud.textContent='FAS 1 • '+names[i]+' • '+(i+1)+'/4 • dra bakåt och släpp'}c.addEventListener('pointerdown',e=>{e.preventDefault();if(fly){placed.push({type:i,x:q.x,y:q.y});i++;fly=false;if(i===4){document.getElementById('done').style.display='grid';hud.textContent='FAS 1 KLAR';return}reset();return}let p=pos(e);if(Math.hypot(p.x-q.x,p.y-q.y)<90)drag=true});c.addEventListener('pointermove',e=>{if(!drag)return;let p=pos(e),dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy);if(d>165){dx*=165/d;dy*=165/d}q.x=a.x+dx;q.y=a.y+dy});c.addEventListener('pointerup',()=>{if(!drag)return;drag=false;let dx=a.x-q.x,dy=a.y-q.y;if(Math.hypot(dx,dy)<8){reset();return}q.vx=dx*6.8;q.vy=dy*6.8;fly=true});document.getElementById('battle').onclick=()=>{document.getElementById('done').style.display='none';hud.textContent='STRIDSFAS • prototyp';};function frame(t){let dt=Math.min(.025,(t-last)/1000);last=t;if(fly){q.vy+=1250*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.x<0||q.x>1600||q.y<0||q.y>900)reset()}x.clearRect(0,0,1600,900);x.save();x.textAlign='center';x.textBaseline='middle';x.font='54px system-ui';x.globalAlpha=.45;for(const o of placed)x.fillText(icons[o.type],o.x,o.y);x.globalAlpha=1;if(i<4)x.fillText(icons[i],q.x,q.y);x.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></body></html>
