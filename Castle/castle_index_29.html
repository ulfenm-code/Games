<script>
const VW=1600,VH=900,bg=new Image();bg.src='castle_bg.jpg';
const wrap=document.getElementById('wrap'),c=document.getElementById('c'),ctx=c.getContext('2d'),setup=document.getElementById('setup');
const TURN_SECONDS=60;let last=performance.now(),drag=false,turn=0,started=false,paused=false,timeLeft=TURN_SECONDS,names=['Player 1','Player 2'];
const SUPA_URL='https://bsegwnammbtfchkycmdc.supabase.co', SUPA_KEY='sb_publishable_RiZ_LruZihCpSiFWoZt6Mw_e-rOfYPX';
let matchId=null,matchCode=null,serverTurnNo=1,deviceRole=1,gamePoll=null,lastSeenTurnNo=0,readyPoll=null,countdownStarted=false;
const net=document.getElementById('net'); function netmsg(x){net.textContent='Castle-Duel: '+x}
async function rest(path,opts={}){const h={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json',Prefer:'return=representation',...(opts.headers||{})};const r=await fetch(SUPA_URL+'/rest/v1/'+path,{...opts,headers:h});const txt=await r.text();if(!r.ok)throw new Error(txt||r.statusText);return txt?JSON.parse(txt):null}
function code4(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let x='';crypto.getRandomValues(new Uint32Array(4)).forEach(n=>x+=chars[n%chars.length]);return x}
async function createOnlineMatch(){for(let tries=0;tries<8;tries++){const code=code4();try{const rows=await rest('matches',{method:'POST',body:JSON.stringify({code,status:'waiting',join_status:'waiting',player1_name:names[0],player2_name:null,current_player:1,turn_no:1})});matchId=rows[0].id;matchCode=code;netmsg('online • match '+code);return}catch(e){if(!String(e).includes('duplicate'))throw e}}throw new Error('Kunde inte skapa matchkod')}
async function saveShot(player,vx,vy,weapon){if(!matchId)return;const power=Math.hypot(vx,vy),angle=Math.atan2(-vy,player===1?vx:-vx)*180/Math.PI;await rest('shots',{method:'POST',body:JSON.stringify({match_id:matchId,turn_no:serverTurnNo,player,vx,vy,power,angle,weapon})})}
async function setServerTurn(p,n){if(!matchId)return;await rest('matches?id=eq.'+encodeURIComponent(matchId),{method:'PATCH',body:JSON.stringify({current_player:p,turn_no:n,updated_at:new Date().toISOString()})})}
const A=[{x:190,y:615},{x:1410,y:615}],q={x:190,y:615,vx:0,vy:0,r:18,fly:false,shotTime:0};
const weaponFiles={arrow:'Arrow.png',cannonball:'CanonBall.png',bomb:'Bomb.png',rocket:'Rocket.png'},weaponLabels={arrow:'PIL',cannonball:'KANONKULA',bomb:'BOMB',rocket:'RAKET'};
const weaponImgs={};Object.entries(weaponFiles).forEach(([k,f])=>{let im=new Image();im.src=f;weaponImgs[k]=im});
let ammo={arrow:3,cannonball:3,bomb:1,rocket:0},selectedWeapon='arrow',flyingWeapon='arrow';
let flyingShooter=1;
const cfg={maxPull:165,power:6.8,g:1250,bounce:.5,ground:785};const PHYS_STEP=1/120;let physAcc=0;
const jf=document.getElementById('joinFlow'),jt=document.getElementById('joinTitle'),jtxt=document.getElementById('joinText'),jc=document.getElementById('joinControls');let joinPoll=null,pendingP2=null;
function showJoin(title,text,html=''){jf.style.display='flex';jt.textContent=title;jtxt.textContent=text;jc.innerHTML=html}function hideJoin(){jf.style.display='none'}
async function getMatch(){if(!matchId)return null;const a=await rest('matches?id=eq.'+encodeURIComponent(matchId)+'&select=*',{method:'GET'});return a&&a[0]}
async function waitForJoin(){clearInterval(joinPoll);showJoin('Match '+matchCode,'Väntar på Player 2…','<button id="smsInvite">Bjud in via SMS</button>');document.getElementById('smsInvite').onclick=inviteSms;joinPoll=setInterval(async()=>{try{const m=await getMatch();if(m&&m.join_status==='requested'){clearInterval(joinPoll);pendingP2=m.player2_name||'Player 2';showJoin(pendingP2+' vill spela!','Vill du släppa in spelaren?','<button id="acceptP2">Acceptera</button><button id="rejectP2">Neka</button>');document.getElementById('acceptP2').onclick=acceptJoin;document.getElementById('rejectP2').onclick=rejectJoin}}catch(e){netmsg('online • väntar på anslutning')}},800)}
function inviteSms(){const inviteUrl='https://ulfenm-code.github.io/Games/Castle/castle_index_29.html?match='+encodeURIComponent(matchCode);const msg=(names[0]||'Player 1')+' vill spela Castle Duel med dig!\n\nTryck på länken för att gå med:\n\n'+inviteUrl;const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent);const sep=isiOS?'&':'?';window.location.href='sms:'+sep+'body='+encodeURIComponent(msg)}
async function acceptJoin(){try{await rest('matches?id=eq.'+encodeURIComponent(matchId),{method:'PATCH',body:JSON.stringify({join_status:'accepted',status:'playing',accepted_at:null,player2_joined_at:null})});names[1]=pendingP2||'Player 2';deviceRole=1;startGameSync();netmsg('online • match '+matchCode);showStartButton()}catch(e){netmsg('accept-fel')}}
async function rejectJoin(){try{await rest('matches?id=eq.'+encodeURIComponent(matchId),{method:'PATCH',body:JSON.stringify({player2_name:null,join_status:'waiting',player2_joined_at:null})});pendingP2=null;waitForJoin()}catch(e){netmsg('neka-fel')}}
async function enterFullscreen(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch(e){netmsg('fullscreen kunde inte aktiveras')}try{if(document.fullscreenElement&&screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch(e){}setTimeout(fit,150)}
function showStartButton(){showJoin('Båda spelarna är anslutna','Tryck STARTA SPEL. Spelet börjar när båda spelarna är klara.','<button id="startFullscreen">STARTA SPEL</button>');document.getElementById('startFullscreen').onclick=async()=>{const btn=document.getElementById('startFullscreen');btn.disabled=true;btn.textContent='VÄNTAR PÅ ANDRA SPELAREN…';await enterFullscreen();await markReady()}}
async function markReady(){try{const field=deviceRole===1?'accepted_at':'player2_joined_at',body={updated_at:new Date().toISOString()};body[field]=new Date().toISOString();await rest('matches?id=eq.'+encodeURIComponent(matchId),{method:'PATCH',body:JSON.stringify(body)});netmsg('online • match '+matchCode+' • redo');waitForBothReady()}catch(e){netmsg('kunde inte markera redo');const btn=document.getElementById('startFullscreen');if(btn){btn.disabled=false;btn.textContent='STARTA SPEL'}}}
function waitForBothReady(){clearInterval(readyPoll);const check=async()=>{try{const m=await getMatch();if(m&&m.accepted_at&&m.player2_joined_at){clearInterval(readyPoll);if(!countdownStarted){countdownStarted=true;hideJoin();beginCountdown()}}}catch(e){netmsg('online • väntar på andra spelaren')}};check();readyPoll=setInterval(check,250)}
function beginCountdown(){const cd=document.getElementById('countdown'),num=document.getElementById('countNum');cd.style.display='flex';let t0=performance.now();const tick=now=>{let remain=Math.max(0,5-Math.floor((now-t0)/1000));if(remain>0){num.textContent=remain;requestAnimationFrame(tick)}else{cd.style.display='none';started=true;turn=0;timeLeft=TURN_SECONDS;last=performance.now();startPlacement()}};requestAnimationFrame(tick)}
function fit(){let s=Math.min(innerWidth/VW,innerHeight/VH);wrap.style.width=VW*s+'px';wrap.style.height=VH*s+'px'}
function anchor(){return A[turn]}function resetShot(){let a=anchor();q.x=a.x;q.y=a.y;q.vx=q.vy=0;q.fly=false;q.shotTime=0;physAcc=0}
function applyServerTurn(player,no){
  const nt=Number(player)-1,nn=Number(no);
  if(nn<serverTurnNo)return;
  const changed=nn!==serverTurnNo||nt!==turn;
  serverTurnNo=nn;turn=nt;
  if(changed){timeLeft=TURN_SECONDS;paused=false;drag=false;resetShot()}
  netmsg(deviceRole===turn+1?'STRIDSFAS • din tur • '+weaponLabels[selectedWeapon]:'STRIDSFAS • väntar på '+names[turn])
}
async function nextTurn(){
  if(deviceRole!==flyingShooter)return;
  const nextPlayer=flyingShooter===1?2:1,nextNo=serverTurnNo+1;
  drag=false;resetShot();
  try{await setServerTurn(nextPlayer,nextNo);applyServerTurn(nextPlayer,nextNo)}
  catch(e){netmsg('turbyte väntar på servern')}
}
function startGameSync(){clearInterval(gamePoll);gamePoll=setInterval(async()=>{
  if(gamePhase!=='battle'||!matchId||!started)return;
  try{
    await loadBattlePlacements();
    const m=await getMatch();
    if(m){
      if(m.player1_name)names[0]=m.player1_name;
      if(m.player2_name)names[1]=m.player2_name;
      const dbPlayer=Number(m.current_player||1),dbNo=Number(m.turn_no||1);
      if(!q.fly)applyServerTurn(dbPlayer,dbNo);
    }
    const shots=await rest('shots?match_id=eq.'+encodeURIComponent(matchId)+'&turn_no=gt.'+lastSeenTurnNo+'&select=turn_no,player,vx,vy,weapon&order=turn_no.asc',{method:'GET'});
    if(shots&&shots.length)for(const sh of shots){
      lastSeenTurnNo=Math.max(lastSeenTurnNo,Number(sh.turn_no)||0);
      if(Number(sh.player)===deviceRole)continue;
      const shotNo=Number(sh.turn_no),shotPlayer=Number(sh.player);
      if(shotNo<serverTurnNo)continue;
      turn=shotPlayer-1;serverTurnNo=shotNo;resetShot();
      flyingWeapon=sh.weapon||'arrow';flyingShooter=shotPlayer;
      q.vx=Number(sh.vx);q.vy=Number(sh.vy);q.shotTime=0;physAcc=0;q.fly=true;
      netmsg('STRIDSFAS • '+names[shotPlayer-1]+' skjuter')
    }
  }catch(e){netmsg('online • synkroniserar')}
},250)}
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*VW/r.width,y:(e.clientY-r.top)*VH/r.height}}
function barRect(i){return i===0?{x:245,y:35,w:430,h:82}:{x:925,y:35,w:430,h:82}}function hit(r,p){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h}

async function savePlacements(){if(!matchId||placements.length!==4)return;await rest('placements?match_id=eq.'+encodeURIComponent(matchId)+'&player=eq.'+deviceRole,{method:'DELETE'});await rest('placements',{method:'POST',body:JSON.stringify(placements.map((o,i)=>({match_id:matchId,player:deviceRole,object_no:i,object_name:targetNames[i],x:o.x,y:o.y,destroyed:false})))})}

let battlePlacements={1:[],2:[]},lastDestroyed=new Set(),impact=null;
async function loadBattlePlacements(){
  if(!matchId)return;
  const rows=await rest('placements?match_id=eq.'+encodeURIComponent(matchId)+'&select=player,object_no,object_name,x,y,destroyed&order=player.asc,object_no.asc',{method:'GET'});
  let bp={1:[],2:[]};
  (rows||[]).forEach(r=>{let p=Number(r.player);if(bp[p])bp[p].push({n:Number(r.object_no),name:r.object_name,x:Number(r.x),y:Number(r.y),destroyed:!!r.destroyed,b:0})});
  // Detect newly destroyed own objects so the owner sees the hit effect at the correct position.
  if(gamePhase==='battle'&&deviceRole){
    for(const o of bp[deviceRole]){
      const key=deviceRole+':'+o.n;
      if(o.destroyed&&!lastDestroyed.has(key)){
        impact={x:o.x,y:o.y,t:0,kind:'hit'};
        lastDestroyed.add(key);
      }
    }
  }
  battlePlacements=bp;
}
function targetBox(o){
  let im=targetImgs[o.n],w=75,h=75;
  if(im&&im.complete&&im.naturalWidth&&im.naturalHeight){
    let sc=Math.min(75/im.naturalWidth,75/im.naturalHeight);w=im.naturalWidth*sc;h=im.naturalHeight*sc;
  }
  return{x:o.x-w*.575,y:o.y-h*.575,w:w*1.15,h:h*1.15};
}
function cannonballTargetHit(){
  if(flyingWeapon!=='cannonball')return null;
  const opponent=flyingShooter===1?2:1;
  const list=battlePlacements[opponent]||[];
  for(const o of list){
    if(o.destroyed)continue;
    const b=targetBox(o),r=q.r;
    if(q.x+r>=b.x&&q.x-r<=b.x+b.w&&q.y+r>=b.y&&q.y-r<=b.y+b.h)return o;
  }
  return null;
}
async function destroyTarget(o){
  const opponent=flyingShooter===1?2:1;
  impact={x:q.x,y:q.y,t:0,kind:'hit'};
  if(deviceRole!==flyingShooter)return;
  o.destroyed=true;
  try{
    await rest('placements?match_id=eq.'+encodeURIComponent(matchId)+'&player=eq.'+opponent+'&object_no=eq.'+o.n,{method:'PATCH',body:JSON.stringify({destroyed:true})});
  }catch(e){netmsg('TRÄFF • väntar på databassynk')}
}
function finishCannonball(kind){
  q.fly=false;physAcc=0;
  if(kind==='ground')impact={x:q.x,y:PLACEMENT_GROUND_Y,t:0,kind:'ground'};
  if(deviceRole===turn+1)setTimeout(()=>nextTurn(),kind==='hit'?520:360);
}

/* FAS 1 */
const targetFiles=['DragonTrans.png','WizardTrans.png','KnightTrans.png','TreasureTrans.png'],targetNames=['DRAKE','TROLLKARL','RIDDARE','SKATTKISTA'];
const targetImgs=targetFiles.map(f=>{let im=new Image();im.src=f;return im});let gamePhase='waiting',placementIndex=0,placements=[],smoke=null;
function placementAnchor(){return A[deviceRole-1]}
function resetPlacementBall(){let a=placementAnchor();q.x=a.x;q.y=a.y;q.vx=q.vy=0;q.fly=false;q.shotTime=0;physAcc=0}
const PLACEMENT_GROUND_Y=745;
function placementFloorY(i=placementIndex){let im=targetImgs[i],halfH=37.5;if(im&&im.complete&&im.naturalWidth&&im.naturalHeight){let sc=Math.min(75/im.naturalWidth,75/im.naturalHeight);halfH=im.naturalHeight*sc/2}return PLACEMENT_GROUND_Y-halfH}
function startPlacement(){gamePhase='placement';placementIndex=0;placements=[];drag=false;resetPlacementBall();netmsg('FAS 1 • Placera '+targetNames[placementIndex])}
let battleReadyPoll=null,battleCountdownStarted=false;
async function placementCounts(){const rows=await rest('placements?match_id=eq.'+encodeURIComponent(matchId)+'&select=player,object_no',{method:'GET'});let sets={1:new Set(),2:new Set()};(rows||[]).forEach(r=>{let p=Number(r.player);if(sets[p])sets[p].add(Number(r.object_no))});return{p1:sets[1].size,p2:sets[2].size}}
async function enterBattle(){hideJoin();gamePhase='battle';timeLeft=TURN_SECONDS;paused=false;drag=false;ammo={arrow:3,cannonball:3,bomb:1,rocket:0};selectedWeapon='cannonball';flyingWeapon='cannonball';pickerX=-PICKER_STEP;last=performance.now();await loadBattlePlacements();try{const m=await getMatch();if(m)applyServerTurn(Number(m.current_player||1),Number(m.turn_no||1));else applyServerTurn(1,1)}catch(e){applyServerTurn(1,1)}}
function beginBattleCountdown(){if(battleCountdownStarted)return;battleCountdownStarted=true;clearInterval(battleReadyPoll);hideJoin();const cd=document.getElementById('countdown'),num=document.getElementById('countNum'),txt=cd.querySelector('.txt');cd.style.display='grid';txt.textContent='Striden börjar';let t0=performance.now();const tick=now=>{let remain=Math.max(0,3-Math.floor((now-t0)/1000));if(remain>0){num.textContent=remain;requestAnimationFrame(tick)}else{cd.style.display='none';txt.textContent='Vrid telefonen till liggande läge';enterBattle()}};requestAnimationFrame(tick)}
function waitForBothPlacements(){clearInterval(battleReadyPoll);const check=async()=>{try{let c=await placementCounts();if(c.p1>=4&&c.p2>=4){beginBattleCountdown();return}let other=deviceRole===1?names[1]:names[0];showJoin('Fas 1 klar','Väntar på att '+other+' ska placera sina objekt…','');netmsg('FAS 1 KLAR • väntar på andra spelaren')}catch(e){netmsg('FAS 1 KLAR • väntar på synkronisering')}};check();battleReadyPoll=setInterval(check,400)}
async function finishPlacement(){q.fly=false;gamePhase='placementDone';netmsg('FAS 1 KLAR • sparar placeringar…');try{await savePlacements();netmsg('FAS 1 KLAR • placeringarna finns i databasen');waitForBothPlacements()}catch(e){netmsg('FAS 1 KLAR • databasfel');showJoin('Kunde inte spara','Placeringarna kunde inte sparas. Försök ansluta igen.','')}}
function lockPlacement(x=q.x,y=q.y){if(!q.fly||gamePhase!=='placement')return;const mid=VW/2;x=deviceRole===1?Math.min(x,mid):Math.max(x,mid);y=Math.min(y,placementFloorY());placements.push({x,y,n:placementIndex,b:performance.now()});smoke={x,y,t:0};placementIndex++;drag=false;if(placementIndex>=4)finishPlacement();else{resetPlacementBall();netmsg('FAS 1 • Placera '+targetNames[placementIndex])}}

const weaponKeys=['arrow','cannonball','bomb','rocket'];
let pickerX=0,pickerDrag=false,pickerStartX=0,pickerStartOffset=0,pickerMoved=false;
const PICKER_STEP=170,PICKER_CENTER=800;
function weaponDockRect(){return{x:475,y:745,w:650,h:145}}
function pickerIndex(){return Math.max(0,Math.min(weaponKeys.length-1,Math.round(-pickerX/PICKER_STEP)))}
function snapPicker(){let i=pickerIndex();pickerX=-i*PICKER_STEP;selectedWeapon=weaponKeys[i]}
function chooseNextWeapon(){let i=weaponKeys.findIndex(k=>ammo[k]>0);if(i<0)i=3;selectedWeapon=weaponKeys[i];pickerX=-i*PICKER_STEP}
function drawWeaponDock(){if(gamePhase!=='battle')return;let d=weaponDockRect();ctx.save();ctx.shadowColor='rgba(0,0,0,.34)';ctx.shadowBlur=28;ctx.fillStyle='rgba(232,238,246,.62)';rr(d.x,d.y,d.w,d.h,38);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.72)';ctx.lineWidth=2;ctx.stroke();
ctx.beginPath();ctx.rect(d.x+8,d.y+8,d.w-16,d.h-16);ctx.clip();
weaponKeys.forEach((k,i)=>{let x=PICKER_CENTER+pickerX+i*PICKER_STEP,dist=Math.abs(x-PICKER_CENTER),focus=Math.max(0,1-dist/PICKER_STEP),scale=.72+.38*focus,disabled=ammo[k]<=0,im=weaponImgs[k];ctx.save();ctx.translate(x,d.y+62);ctx.scale(scale,scale);ctx.globalAlpha=disabled?.25:(.58+.42*focus);if(im&&im.complete&&im.naturalWidth){let mw=k==='arrow'?112:k==='rocket'?98:k==='bomb'?74:68,mh=62,sc=Math.min(mw/im.naturalWidth,mh/im.naturalHeight);ctx.drawImage(im,-im.naturalWidth*sc/2,-im.naturalHeight*sc/2,im.naturalWidth*sc,im.naturalHeight*sc)}ctx.globalAlpha=disabled?.35:(.7+.3*focus);ctx.fillStyle='#101217';ctx.font='800 14px system-ui';ctx.textAlign='center';ctx.fillText(weaponLabels[k],0,49);ctx.font='900 19px system-ui';ctx.fillText('×'+ammo[k],0,70);ctx.restore()});
ctx.restore();
ctx.save();let fw=142,fh=126,fx=PICKER_CENTER-fw/2,fy=d.y+9;ctx.shadowColor='rgba(74,144,255,.42)';ctx.shadowBlur=22;ctx.fillStyle='rgba(255,255,255,.10)';rr(fx,fy,fw,fh,30);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=3;ctx.stroke();ctx.strokeStyle='rgba(85,151,255,.9)';ctx.lineWidth=2;rr(fx+4,fy+4,fw-8,fh-8,26);ctx.stroke();ctx.restore()}
function drawProjectile(){let im=weaponImgs[flyingWeapon];if(!im||!im.complete||!im.naturalWidth){ctx.fillStyle='#222';ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();return}let maxW=flyingWeapon==='arrow'?92:flyingWeapon==='rocket'?84:flyingWeapon==='bomb'?54:48,maxH=flyingWeapon==='arrow'?34:flyingWeapon==='rocket'?48:flyingWeapon==='bomb'?54:48,sc=Math.min(maxW/im.naturalWidth,maxH/im.naturalHeight),w=im.naturalWidth*sc,h=im.naturalHeight*sc;ctx.save();ctx.translate(q.x,q.y);if(flyingWeapon==='arrow'||flyingWeapon==='rocket')ctx.rotate(Math.atan2(q.vy,q.vx));ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()}
c.addEventListener('pointerdown',e=>{if(!started)return;e.preventDefault();let z=pos(e);if(gamePhase==='placement'){if(q.fly){lockPlacement();return}if(Math.hypot(z.x-q.x,z.y-q.y)<70){drag=true;c.setPointerCapture(e.pointerId)}return}if(gamePhase!=='battle')return;let dock=weaponDockRect();if(hit(dock,z)&&!q.fly){pickerDrag=true;pickerMoved=false;pickerStartX=z.x;pickerStartOffset=pickerX;c.setPointerCapture(e.pointerId);return}if(deviceRole!==turn+1)return;let br=barRect(turn);if(hit(br,z)){paused=!paused;return}if(paused||q.fly)return;if(Math.hypot(z.x-q.x,z.y-q.y)<65){drag=true;c.setPointerCapture(e.pointerId)}})
c.addEventListener('pointermove',e=>{let z=pos(e);if(pickerDrag){let dx=z.x-pickerStartX;if(Math.abs(dx)>8)pickerMoved=true;pickerX=Math.max(-(weaponKeys.length-1)*PICKER_STEP,Math.min(0,pickerStartOffset+dx));selectedWeapon=weaponKeys[pickerIndex()];return}if(!drag||paused)return;let a=gamePhase==='placement'?placementAnchor():anchor(),dx=z.x-a.x,dy=z.y-a.y,d=Math.hypot(dx,dy);if(d>cfg.maxPull){dx*=cfg.maxPull/d;dy*=cfg.maxPull/d}let side=gamePhase==='placement'?deviceRole-1:turn;if(side===0&&dx>30)dx=30;if(side===1&&dx<-30)dx=-30;q.x=a.x+dx;q.y=a.y+dy})
c.addEventListener('pointerup',e=>{if(pickerDrag){pickerDrag=false;snapPicker();return}if(!drag||paused)return;drag=false;let a=gamePhase==='placement'?placementAnchor():anchor(),dx=a.x-q.x,dy=a.y-q.y;if(Math.hypot(dx,dy)<8){gamePhase==='placement'?resetPlacementBall():resetShot();return}q.x=a.x;q.y=a.y;q.vx=dx*cfg.power;q.vy=dy*cfg.power;q.shotTime=0;physAcc=0;q.fly=true;if(gamePhase==='battle'){if(deviceRole!==turn+1){q.fly=false;resetShot();netmsg('STRIDSFAS • väntar på '+names[turn]);return}if(ammo[selectedWeapon]<=0){q.fly=false;resetShot();return}flyingWeapon=selectedWeapon;flyingShooter=deviceRole;ammo[selectedWeapon]--;saveShot(deviceRole,q.vx,q.vy,flyingWeapon).catch(e=>netmsg('skott lokalt; databasfel'));if(ammo[selectedWeapon]<=0)chooseNextWeapon()}})
function stepBattle(){q.shotTime+=PHYS_STEP;q.vy+=cfg.g*PHYS_STEP;let ox=q.x,oy=q.y;q.x+=q.vx*PHYS_STEP;q.y+=q.vy*PHYS_STEP;
if(flyingWeapon==='cannonball'){
  let hitObj=cannonballTargetHit();
  if(hitObj){destroyTarget(hitObj);finishCannonball('hit');return false}
  if(oy<PLACEMENT_GROUND_Y&&q.y>=PLACEMENT_GROUND_Y){let t=(PLACEMENT_GROUND_Y-oy)/(q.y-oy||1);q.x=ox+(q.x-ox)*t;q.y=PLACEMENT_GROUND_Y;finishCannonball('ground');return false}
  if(q.x<-60||q.x>VW+60||q.y>VH+60||q.shotTime>7){finishCannonball('ground');return false}
  return true
}
if(q.x-q.r<0){q.x=q.r;q.vx=Math.abs(q.vx)*cfg.bounce}if(q.x+q.r>VW){q.x=VW-q.r;q.vx=-Math.abs(q.vx)*cfg.bounce}if(q.y+q.r>cfg.ground){q.y=cfg.ground-q.r;if(Math.abs(q.vy)>75)q.vy=-Math.abs(q.vy)*cfg.bounce;else q.vy=0;q.vx*=.96}if((Math.abs(q.vx)<18&&Math.abs(q.vy)<18&&q.y+q.r>=cfg.ground-1)||q.shotTime>7){if(deviceRole===turn+1)nextTurn();else{q.fly=false;physAcc=0}return false}return true}
function update(dt){if(!started)return;if(gamePhase==='placement'){if(q.fly){physAcc+=dt;let n=0;while(q.fly&&physAcc>=PHYS_STEP&&n<12){physAcc-=PHYS_STEP;q.vy+=cfg.g*PHYS_STEP;let ox=q.x,oy=q.y;q.x+=q.vx*PHYS_STEP;q.y+=q.vy*PHYS_STEP;n++;let floorY=placementFloorY();if(oy<floorY&&q.y>=floorY){let t=(floorY-oy)/(q.y-oy||1),cx=ox+(q.x-ox)*t;q.x=cx;q.y=floorY;lockPlacement(cx,floorY);break}let crossed=deviceRole===1?(ox<VW/2&&q.x>=VW/2):(ox>VW/2&&q.x<=VW/2);if(crossed){let t=(VW/2-ox)/(q.x-ox||1),cy=oy+(q.y-oy)*t;q.x=VW/2;q.y=Math.min(cy,floorY);lockPlacement(VW/2,q.y);break}if(q.x<-50||q.x>VW+50||q.y>VH+100){resetPlacementBall();break}}}return}if(gamePhase!=='battle'||paused)return;if(!q.fly){timeLeft-=dt;if(timeLeft<=0&&deviceRole===turn+1)nextTurn()}else{physAcc+=dt;let n=0;while(q.fly&&physAcc>=PHYS_STEP&&n<12){physAcc-=PHYS_STEP;if(!stepBattle())break;n++}}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,Math.max(0,w),h,r)}
function drawBar(i){let r=barRect(i),active=i===turn;ctx.fillStyle='rgba(83,49,20,.94)';rr(r.x,r.y,r.w,r.h,16);ctx.fill();ctx.strokeStyle=active?'#ffd44c':'#a9783c';ctx.lineWidth=active?5:3;ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 25px system-ui';ctx.textAlign='left';ctx.fillText(names[i],r.x+18,r.y+31);let bx=r.x+18,by=r.y+48,bw=r.w-100,bh=18;ctx.fillStyle='#171717';rr(bx,by,bw,bh,9);ctx.fill();let f=i===turn?Math.max(0,timeLeft/TURN_SECONDS):1;ctx.fillStyle=i===0?'#e83b3b':'#2ca4ef';rr(bx,by,bw*f,bh,9);ctx.fill();ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='900 23px system-ui';ctx.fillText(i===turn?Math.ceil(timeLeft)+'s':TURN_SECONDS+'s',r.x+r.w-18,r.y+65);if(active){ctx.font='900 27px system-ui';ctx.fillText(paused?'▶':'Ⅱ',r.x+r.w-17,r.y+32)}}
function trajectory(){if(!drag)return;let a=gamePhase==='placement'?placementAnchor():anchor(),vx=(a.x-q.x)*cfg.power,vy=(a.y-q.y)*cfg.power;ctx.fillStyle='#fff';for(let i=1;i<30;i++){let t=i*.055,x=a.x+vx*t,y=a.y+vy*t+.5*cfg.g*t*t;if(x<0||x>VW||y>cfg.ground)break;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()}}
function drawMagicBall(){let g=ctx.createRadialGradient(q.x-8,q.y-9,2,q.x,q.y,25);g.addColorStop(0,'#fff');g.addColorStop(.25,'#dffaff');g.addColorStop(.65,'#39aaff');g.addColorStop(1,'#173da8');ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,25,0,Math.PI*2);ctx.fill()}
function drawSmoke(){if(!smoke)return;smoke.t+=.035;let al=1-smoke.t,r=35+smoke.t*100;ctx.save();ctx.globalAlpha=Math.max(0,al);ctx.fillStyle='#fff';for(let k=0;k<7;k++){let an=k*6.28/7;ctx.beginPath();ctx.arc(smoke.x+Math.cos(an)*r*.3,smoke.y+Math.sin(an)*r*.25,r*.3,0,6.28);ctx.fill()}ctx.restore();if(smoke.t>=1)smoke=null}
function drawTarget(o){if(o.destroyed)return;let im=targetImgs[o.n];if(!im.complete||!im.naturalWidth)return;let grow=o.b?Math.min(1,(performance.now()-o.b)/350):1,max=75,scale=Math.min(max/im.naturalWidth,max/im.naturalHeight)*grow,w=im.naturalWidth*scale,h=im.naturalHeight*scale;ctx.drawImage(im,o.x-w/2,o.y-h/2,w,h)}
function drawImpact(){if(!impact)return;impact.t+=.045;let t=impact.t;ctx.save();if(impact.kind==='ground'){ctx.globalAlpha=Math.max(0,1-t);ctx.fillStyle='rgba(225,220,205,.9)';for(let i=0;i<6;i++){let a=i*1.047,r=12+t*45;ctx.beginPath();ctx.arc(impact.x+Math.cos(a)*r*.45,impact.y-4-Math.abs(Math.sin(a))*r*.3,8+t*13,0,6.28);ctx.fill()}}else{let fade=Math.max(0,1-t);ctx.globalAlpha=fade;ctx.translate(impact.x,impact.y);ctx.strokeStyle='#ffd45c';ctx.lineWidth=5;for(let i=0;i<10;i++){let a=i*.628,len=22+t*52;ctx.beginPath();ctx.moveTo(Math.cos(a)*8,Math.sin(a)*8);ctx.lineTo(Math.cos(a)*len,Math.sin(a)*len);ctx.stroke()}ctx.fillStyle='rgba(255,190,55,.95)';ctx.beginPath();ctx.arc(0,0,28+t*18,0,6.28);ctx.fill();ctx.fillStyle='rgba(235,235,230,.75)';for(let i=0;i<5;i++){let a=i*1.256,r=22+t*45;ctx.beginPath();ctx.arc(Math.cos(a)*r*.45,-5+Math.sin(a)*r*.3,9+t*10,0,6.28);ctx.fill()}}ctx.restore();if(t>=1)impact=null}
