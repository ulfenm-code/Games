<!doctype html><html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Castle Duel 16:9</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0d12;touch-action:none;font-family:system-ui}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);aspect-ratio:16/9;max-width:100vw;max-height:100vh}
canvas{display:block;width:100%;height:100%;touch-action:none}
#setup{position:fixed;inset:0;display:grid;place-items:center;background:#0008;z-index:4}#countdown{position:fixed;inset:0;display:none;place-items:center;background:#0009;z-index:5;color:white;text-align:center}#countdown .num{font:900 clamp(72px,18vw,180px) system-ui;line-height:.9;text-shadow:0 6px 15px #000}#countdown .txt{font:800 clamp(18px,4vw,34px) system-ui;margin-top:18px;text-shadow:0 3px 8px #000}
.card{width:min(520px,84vw);background:#f0d6a4;border:5px solid #79501f;border-radius:18px;padding:18px 22px;text-align:center;color:#24170d}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:900;display:block;margin-bottom:5px}
input{box-sizing:border-box;width:100%;font-size:17px;padding:11px;border:2px solid #8b6a42;border-radius:9px}
button{font:900 19px system-ui;padding:12px 25px;border:3px solid #5b3d13;border-radius:12px;background:#299a34;color:white;margin-top:16px}
#net{position:fixed;left:10px;bottom:8px;z-index:8;background:#000a;color:#fff;font:700 12px system-ui;padding:5px 8px;border-radius:8px;pointer-events:none}
#joinFlow{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#000b}
#joinCard{width:min(560px,88vw);background:#3b2418;color:white;border:4px solid #e6b94b;border-radius:22px;padding:24px;text-align:center;font:700 20px system-ui}
#joinCard h2{margin:0 0 12px;font-size:30px} #joinCard button{font:800 20px system-ui;padding:12px 22px;margin:8px;border:0;border-radius:14px}
#joinCard input{font:700 20px system-ui;padding:12px;width:min(300px,75%);margin:7px;border-radius:12px;border:2px solid #ddd;text-transform:uppercase}
</style></head><body>
<div id="joinFlow"><div id="joinCard"><h2 id="joinTitle">Online multiplayer</h2><div id="joinText"></div><div id="joinControls"></div></div></div><div id="net">Castle-Duel: ansluter…</div><div id="wrap"><canvas id="c" width="1600" height="900"></canvas></div>
<div id="setup"><form class="card" id="form">
<div><label>Player 1</label><input id="p1" maxlength="18" placeholder="Skriv namn..." required></div>
<button>STARTA SPEL</button></form></div><div id="countdown"><div><div class="num" id="countNum">5</div><div class="txt">Vrid telefonen till liggande läge</div></div></div><script>
const VW=1600,VH=900,bg=new Image();bg.src='castle_bg.jpg';
const wrap=document.getElementById('wrap'),c=document.getElementById('c'),ctx=c.getContext('2d'),setup=document.getElementById('setup');
const TURN_SECONDS=60;let last=performance.now(),drag=false,turn=0,started=false,paused=false,timeLeft=TURN_SECONDS,names=['Player 1','Player 2'];
const SUPA_URL='https://bsegwnammbtfchkycmdc.supabase.co', SUPA_KEY='sb_publishable_RiZ_LruZihCpSiFWoZt6Mw_e-rOfYPX';let matchId=null, matchCode=null, netBusy=false, serverTurnNo=1, deviceRole=1, gamePoll=null, lastSeenTurnNo=0;const net=document.getElementById('net');
function netmsg(x){net.textContent='Castle-Duel: '+x}
async function rest(path,opts={}){const h={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json',Prefer:'return=representation',...(opts.headers||{})};const r=await fetch(SUPA_URL+'/rest/v1/'+path,{...opts,headers:h});const txt=await r.text();if(!r.ok)throw new Error(txt||r.statusText);return txt?JSON.parse(txt):null}
function code4(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let x='';crypto.getRandomValues(new Uint32Array(4)).forEach(n=>x+=chars[n%chars.length]);return x}
async function createOnlineMatch(){for(let tries=0;tries<8;tries++){const code=code4();try{const rows=await rest('matches',{method:'POST',body:JSON.stringify({code,status:'waiting',join_status:'waiting',player1_name:names[0],player2_name:null,current_player:1,turn_no:1})});matchId=rows[0].id;matchCode=code;netmsg('online • match '+code);return}catch(e){if(!String(e).includes('duplicate'))throw e}}throw new Error('Kunde inte skapa matchkod')}
async function saveShot(player,vx,vy){if(!matchId)return;const power=Math.hypot(vx,vy),angle=Math.atan2(-vy,player===1?vx:-vx)*180/Math.PI;await rest('shots',{method:'POST',body:JSON.stringify({match_id:matchId,turn_no:serverTurnNo,player,vx,vy,power,angle})})}
async function setServerTurn(p,n){if(!matchId)return;await rest('matches?id=eq.'+encodeURIComponent(matchId),{method:'PATCH',body:JSON.stringify({current_player:p,turn_no:n,updated_at:new Date().toISOString()})})}
const A=[{x:190,y:615},{x:1410,y:615}],q={x:190,y:615,vx:0,vy:0,r:18,fly:false,shotTime:0};const cfg={maxPull:165,power:6.8,g:1250,bounce:.5,ground:785};
const jf=document.getElementById('joinFlow'),jt=document.getElementById('joinTitle'),jtxt=document.getElementById('joinText'),jc=document.getElementById('joinControls');let joinPoll=null,pendingP2=null;
function showJoin(title,text,html=''){jf.style.display='flex';jt.textContent=title;jtxt.textContent=text;jc.innerHTML=html}function hideJoin(){jf.style.display='none'}
async function getMatch(){if(!matchId)return null;const a=await rest('matches?id=eq.'+encodeURIComponent(matchId)+'&select=*',{method:'GET'});return a&&a[0]}
async function waitForJoin(){clearInterval(joinPoll);showJoin('Match '+matchCode,'Väntar på Player 2…','<button id="smsInvite">Bjud in via SMS</button>');document.getElementById('smsInvite').onclick=inviteSms;joinPoll=setInterval(async()=>{try{const m=await getMatch();if(m&&m.join_status==='requested'){clearInterval(joinPoll);pendingP2=m.player2_name||'Player 2';showJoin(pendingP2+' vill spela!','Vill du släppa in spelaren?','<button id="acceptP2">Acceptera</button><button id="rejectP2">Neka</button>');document.getElementById('acceptP2').onclick=acceptJoin;document.getElementById('rejectP2').onclick=rejectJoin}}catch(e){netmsg('online • väntar på anslutning')}},800)}
function inviteSms(){const inviteUrl='https://ulfenm-code.github.io/Games/Castle/castle_index_04.html?match='+encodeURIComponent(matchCode);const msg=(names[0]||'Player 1')+' vill spela Castle Duel med dig!\n\nTryck på länken för att gå med:\n\n'+inviteUrl;const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent);const sep=isiOS?'&':'?';window.location.href='sms:'+sep+'body='+encodeURIComponent(msg)}
async function requestJoin(code,name){try{const rows=await rest('matches?code=eq.'+encodeURIComponent(code)+'&join_status=eq.waiting&select=id,code',{method:'GET'});if(!rows||!rows.length)throw new Error('Matchen finns inte eller är upptagen');const id=rows[0].id;await rest('matches?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({player2_name:name,join_status:'requested',player2_joined_at:new Date().toISOString()})});netmsg(name+' har begärt att gå med')}catch(e){netmsg('join-fel')}}
async function acceptJoin(){try{await rest('matches?id=eq.'+encodeURIComponent(matchId),{method:'PATCH',body:JSON.stringify({join_status:'accepted',status:'playing',accepted_at:new Date().toISOString()})});names[1]=pendingP2||'Player 2';deviceRole=1;hideJoin();startGameSync();beginCountdown()}catch(e){netmsg('accept-fel')}}
async function rejectJoin(){try{await rest('matches?id=eq.'+encodeURIComponent(matchId),{method:'PATCH',body:JSON.stringify({player2_name:null,join_status:'waiting',player2_joined_at:null})});pendingP2=null;waitForJoin()}catch(e){netmsg('neka-fel')}}
function startGameSync(){clearInterval(gamePoll);gamePoll=setInterval(async()=>{if(!matchId||!started||q.fly)return;try{const m=await getMatch();if(m){if(m.player1_name)names[0]=m.player1_name;if(m.player2_name)names[1]=m.player2_name;const serverTurn=Number(m.current_player||1)-1;const serverNo=Number(m.turn_no||1);if(serverNo>serverTurnNo&&!q.fly){serverTurnNo=serverNo;turn=serverTurn;timeLeft=TURN_SECONDS;resetShot()}}const shots=await rest('shots?match_id=eq.'+encodeURIComponent(matchId)+'&turn_no=gt.'+lastSeenTurnNo+'&select=turn_no,player,vx,vy&order=turn_no.asc',{method:'GET'});if(shots&&shots.length){for(const sh of shots){lastSeenTurnNo=Math.max(lastSeenTurnNo,Number(sh.turn_no)||0);if(Number(sh.player)===deviceRole)continue;turn=Number(sh.player)-1;serverTurnNo=Number(sh.turn_no);resetShot();q.vx=Number(sh.vx);q.vy=Number(sh.vy);q.fly=true}}}catch(e){netmsg('online • synkroniserar')}},350)}
function beginCountdown(){const cd=document.getElementById('countdown'),num=document.getElementById('countNum');cd.style.display='flex';let t0=performance.now();const tick=now=>{let elapsed=(now-t0)/1000,remain=Math.max(0,5-Math.floor(elapsed));if(remain>0){num.textContent=remain;requestAnimationFrame(tick)}else{cd.style.display='none';started=true;turn=0;timeLeft=TURN_SECONDS;resetShot();last=performance.now()}};requestAnimationFrame(tick)}
function fit(){let s=Math.min(innerWidth/VW,innerHeight/VH);wrap.style.width=(VW*s)+'px';wrap.style.height=(VH*s)+'px'}function anchor(){return A[turn]}function resetShot(){let a=anchor();q.x=a.x;q.y=a.y;q.vx=q.vy=0;q.fly=false;q.shotTime=0}
function nextTurn(){turn=1-turn;timeLeft=TURN_SECONDS;paused=false;drag=false;resetShot();serverTurnNo++;setServerTurn(turn+1,serverTurnNo).catch(e=>netmsg('tur lokalt; databasfel'))}
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*VW/r.width,y:(e.clientY-r.top)*VH/r.height}}function barRect(i){return i===0?{x:245,y:35,w:430,h:82}:{x:925,y:35,w:430,h:82}}function hit(r,p){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h}
c.addEventListener('pointerdown',e=>{if(!started||deviceRole!==turn+1)return;e.preventDefault();let z=pos(e),br=barRect(turn);if(turn===0&&hit(br,z)){paused=!paused;return}if(paused||q.fly)return;if(Math.hypot(z.x-q.x,z.y-q.y)<65){drag=true;c.setPointerCapture(e.pointerId)}});c.addEventListener('pointermove',e=>{if(!drag||paused)return;let a=anchor(),z=pos(e),dx=z.x-a.x,dy=z.y-a.y,d=Math.hypot(dx,dy);if(d>cfg.maxPull){dx*=cfg.maxPull/d;dy*=cfg.maxPull/d}if(turn===0&&dx>30)dx=30;if(turn===1&&dx<-30)dx=-30;q.x=a.x+dx;q.y=a.y+dy});c.addEventListener('pointerup',e=>{if(!drag||paused)return;drag=false;let a=anchor(),dx=a.x-q.x,dy=a.y-q.y;if(Math.hypot(dx,dy)<8){resetShot();return}q.vx=dx*cfg.power;q.vy=dy*cfg.power;q.fly=true;saveShot(deviceRole,q.vx,q.vy).catch(e=>netmsg('skott lokalt; databasfel'))});
function update(dt){if(!started||paused)return;if(!q.fly){timeLeft-=dt;if(timeLeft<=0){nextTurn();return}}else{q.shotTime+=dt;q.vy+=cfg.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.x-q.r<0){q.x=q.r;q.vx=Math.abs(q.vx)*cfg.bounce}if(q.x+q.r>VW){q.x=VW-q.r;q.vx=-Math.abs(q.vx)*cfg.bounce}if(q.y+q.r>cfg.ground){q.y=cfg.ground-q.r;if(Math.abs(q.vy)>75)q.vy=-Math.abs(q.vy)*cfg.bounce;else q.vy=0;q.vx*=.96}if((Math.abs(q.vx)<18&&Math.abs(q.vy)<18&&q.y+q.r>=cfg.ground-1)||q.shotTime>7)nextTurn()}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,Math.max(0,w),h,r)}function drawBar(i){let r=barRect(i),active=i===turn;ctx.fillStyle='rgba(83,49,20,.94)';rr(r.x,r.y,r.w,r.h,16);ctx.fill();ctx.strokeStyle=active?'#ffd44c':'#a9783c';ctx.lineWidth=active?5:3;ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 25px system-ui';ctx.textAlign='left';ctx.fillText(names[i],r.x+18,r.y+31);let bx=r.x+18,by=r.y+48,bw=r.w-100,bh=18;ctx.fillStyle='#171717';rr(bx,by,bw,bh,9);ctx.fill();let f=i===turn?Math.max(0,timeLeft/TURN_SECONDS):1;ctx.fillStyle=i===0?'#e83b3b':'#2ca4ef';rr(bx,by,bw*f,bh,9);ctx.fill();ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='900 23px system-ui';ctx.fillText(i===turn?Math.ceil(timeLeft)+'s':TURN_SECONDS+'s',r.x+r.w-18,r.y+65);if(active&&i===0){ctx.font='900 27px system-ui';ctx.fillText(paused?'▶':'Ⅱ',r.x+r.w-17,r.y+32)}}
function trajectory(){if(!drag)return;let a=anchor(),vx=(a.x-q.x)*cfg.power,vy=(a.y-q.y)*cfg.power;ctx.fillStyle='#fff';for(let i=1;i<30;i++){let t=i*.055,x=a.x+vx*t,y=a.y+vy*t+.5*cfg.g*t*t;if(x<0||x>VW||y>cfg.ground)break;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()}}
function draw(){ctx.clearRect(0,0,VW,VH);if(bg.complete)ctx.drawImage(bg,0,0,VW,VH);if(!started)return;drawBar(0);drawBar(1);let a=anchor();if(drag){ctx.strokeStyle='#3b2415';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x-17,a.y-8);ctx.lineTo(q.x,q.y);ctx.lineTo(a.x+17,a.y-8);ctx.stroke()}trajectory();let g=ctx.createRadialGradient(q.x-6,q.y-7,2,q.x,q.y,q.r);g.addColorStop(0,'#888');g.addColorStop(.5,'#34383d');g.addColorStop(1,'#080b0e');ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();if(paused){ctx.fillStyle='#0008';ctx.fillRect(0,390,VW,120);ctx.fillStyle='white';ctx.font='900 45px system-ui';ctx.textAlign='center';ctx.fillText(names[turn]+' – PAUS',VW/2,465)}}function loop(t){let dt=Math.min((t-last)/1000,.025);last=t;update(dt);draw();requestAnimationFrame(loop)}
async function landscape(){try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch(e){}try{if(screen.orientation?.lock)await screen.orientation.lock('landscape')}catch(e){}setTimeout(fit,150)}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();names[0]=document.getElementById('p1').value.trim()||'Player 1';names[1]='Player 2';deviceRole=1;setup.style.display='none';landscape();try{await createOnlineMatch();await waitForJoin()}catch(err){netmsg('kunde inte skapa onlinematch');setup.style.display='flex'}})
async function joinFromInvite(code,name){code=(code||'').trim().toUpperCase();name=(name||'').trim();if(!code||!name)return;try{const rows=await rest('matches?code=eq.'+encodeURIComponent(code)+'&join_status=eq.waiting&select=id,code,player1_name',{method:'GET'});if(!rows||!rows.length)throw new Error('Matchen finns inte längre eller är upptagen');matchId=rows[0].id;matchCode=code;names[0]=rows[0].player1_name||'Player 1';names[1]=name;deviceRole=2;await rest('matches?id=eq.'+encodeURIComponent(matchId),{method:'PATCH',body:JSON.stringify({player2_name:name,join_status:'requested',player2_joined_at:new Date().toISOString()})});showJoin('Förfrågan skickad','Väntar på att '+names[0]+' accepterar dig…','');clearInterval(joinPoll);joinPoll=setInterval(async()=>{try{const m=await getMatch();if(m&&m.join_status==='accepted'){clearInterval(joinPoll);hideJoin();startGameSync();beginCountdown()}else if(m&&m.join_status==='rejected'){clearInterval(joinPoll);showJoin('Inbjudan nekades',names[0]+' nekade anslutningen.','')}}catch(e){}},800)}catch(e){showJoin('Kunde inte gå med',e.message||'Kontrollera länken och försök igen.','')}}
function checkInviteLink(){const code=new URLSearchParams(location.search).get('match');if(!code)return;setup.style.display='none';showJoin('Du är inbjuden','Matchkod '+code.toUpperCase(),'<input id="inviteName" maxlength="18" placeholder="Ditt namn"><br><button id="joinInvite">Gå med i spelet</button>');document.getElementById('joinInvite').onclick=()=>{landscape();joinFromInvite(code,document.getElementById('inviteName').value)}}
addEventListener('resize',fit);fit();requestAnimationFrame(loop);checkInviteLink();
</script></body></html>
