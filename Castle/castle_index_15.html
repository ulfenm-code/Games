<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Castle Duel v15</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0d12;font-family:system-ui}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.phase{position:fixed;inset:0;z-index:50;background:linear-gradient(#77c7ee,#d9eff8 68%,#6c9b51);color:#fff;display:none;touch-action:none}.phase.on{display:block}.top{text-align:center;padding:14px;background:#132033cc}.top b{font-size:24px}.top div{font-size:14px}.sky{position:absolute;inset:76px 0 0}.castle{position:absolute;bottom:0;font-size:105px}.castle.left{left:25px}.castle.right{right:25px}.sling{position:absolute;bottom:90px;font-size:62px}.sling.left{left:145px}.sling.right{right:145px}.obj{position:absolute;font-size:54px;transform:translate(-50%,-50%);filter:drop-shadow(0 5px 5px #0006);user-select:none}.locked{opacity:.55;filter:grayscale(1) drop-shadow(0 5px 5px #0006)}.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#111c;padding:9px 16px;border-radius:16px;font-weight:800;white-space:nowrap}.progress{position:absolute;top:12px;right:15px;background:#111a;padding:8px 12px;border-radius:14px;font-weight:900}</style></head><body><iframe id="base" src="castle_index_13.html"></iframe><div id="placement" class="phase"><div class="top"><b>FAS 1 • HEMLIG UTPLACERING</b><div id="sub">Skjut upp objektet och tryck på skärmen när du vill låsa det i luften</div></div><div class="sky" id="sky"><div class="castle left">🏰</div><div class="castle right">🏰</div><div class="sling left">Y</div><div class="sling right">Y</div><div class="progress" id="prog">1 / 4</div><div class="hint" id="hint">DRA OCH SLÄPP • TRYCK SEDAN FÖR ATT LÅSA</div></div></div><script>
const base=document.getElementById('base'),placement=document.getElementById('placement'),sky=document.getElementById('sky'),prog=document.getElementById('prog'),sub=document.getElementById('sub'),hint=document.getElementById('hint');if(location.search)base.src='castle_index_13.html'+location.search;
const targets=[['🐉','DRAKE'],['💥','FLYGANDE KANON'],['💎','MAGISK KRISTALL'],['🛢️','BOMBTUNNA']];let role=1,index=0,shot=null,drag=false,start=null,raf=0,last=0;
function showPlacement(){placement.classList.add('on');spawn()}function anchor(){let r=sky.getBoundingClientRect();return{x:role===1?190:r.width-190,y:r.height-135}}function spawn(){if(index>=4){prog.textContent='4 / 4';sub.textContent='Dina fyra objekt är utplacerade';hint.textContent='VÄNTAR PÅ MOTSTÅNDAREN…';return}let a=anchor();shot=document.createElement('div');shot.className='obj';shot.textContent=targets[index][0];shot.dataset.name=targets[index][1];shot.style.left=a.x+'px';shot.style.top=a.y+'px';sky.appendChild(shot);prog.textContent=(index+1)+' / 4';sub.textContent='Placera '+targets[index][1]}
function p(e){let r=sky.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
sky.addEventListener('pointerdown',e=>{if(index>=4)return;let z=p(e);if(shot&&Math.hypot(z.x-parseFloat(shot.style.left),z.y-parseFloat(shot.style.top))<90&&!shot.flying){drag=true;start=z;sky.setPointerCapture(e.pointerId);return}if(shot&&shot.flying){shot.flying=false;shot.classList.add('locked');cancelAnimationFrame(raf);index++;setTimeout(spawn,250)}});
sky.addEventListener('pointermove',e=>{if(!drag||!shot)return;let z=p(e),a=anchor(),dx=z.x-a.x,dy=z.y-a.y,d=Math.hypot(dx,dy),m=150;if(d>m){dx*=m/d;dy*=m/d}shot.style.left=(a.x+dx)+'px';shot.style.top=(a.y+dy)+'px'});
sky.addEventListener('pointerup',e=>{if(!drag||!shot)return;drag=false;let a=anchor(),x=parseFloat(shot.style.left),y=parseFloat(shot.style.top),dx=a.x-x,dy=a.y-y;if(Math.hypot(dx,dy)<8){shot.style.left=a.x+'px';shot.style.top=a.y+'px';return}shot.vx=dx*4.2;shot.vy=dy*4.2;shot.flying=true;last=performance.now();raf=requestAnimationFrame(fly)});
function fly(t){if(!shot||!shot.flying)return;let dt=Math.min(.025,(t-last)/1000);last=t;shot.vy+=360*dt;let x=parseFloat(shot.style.left)+shot.vx*dt,y=parseFloat(shot.style.top)+shot.vy*dt;shot.style.left=x+'px';shot.style.top=y+'px';let r=sky.getBoundingClientRect();if(x<-60||x>r.width+60||y>r.height+60){shot.remove();spawn();return}raf=requestAnimationFrame(fly)}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='castle-role')role=e.data.role||1});setTimeout(showPlacement,6500);
</script></body></html>
