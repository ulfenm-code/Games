<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Castle Duel v19</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0d12;font-family:system-ui;touch-action:none}canvas{width:100%;height:100%;display:block;background:url('castle_bg.jpg') center/cover no-repeat}.ov{position:fixed;inset:0;display:grid;place-items:center;background:#0009}.card{background:#f0d6a4;color:#24170d;border:5px solid #79501f;border-radius:18px;padding:20px;text-align:center}button,input{font:800 18px system-ui;padding:11px;margin:7px;border-radius:10px}#done{display:none}#hud{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#000b;color:#fff;padding:8px 14px;border-radius:12px;font-weight:900}</style></head><body><canvas id="c" width="1600" height="900"></canvas><div id="hud">Castle Duel • START</div><div id="setup" class="ov"><div class="card"><h2>Castle Duel</h2><p>SMS / Player 2 / STARTA SPEL</p><button id="start">STARTA SPEL</button></div></div><div id="done" class="ov"><div class="card"><h2>Fas 1 klar</h2><button id="battle">STARTA STRIDSFASEN</button></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),hud=document.getElementById('hud'),files=['Dragon.png','Wizard.png','Knight.png','Treasure.png'],names=['DRAKE','TROLLKARL','RIDDARE','SKATTKISTA'],imgs=files.map(f=>{let i=new Image;i.src=f;return i});let phase='start',n=0,placed=[],drag=false,fly=false,smoke=null,last=performance.now(),q={x:190,y:615,vx:0,vy:0};const a={x:190,y:615};function reset(){q={x:a.x,y:a.y,vx:0,vy:0};drag=fly=false}function status(){hud.textContent='FAS 1 • '+names[n]+' '+(n+1)+'/4 • skjut kulan och tryck medan den flyger'}document.getElementById('start').onclick=async()=>{try{await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch(e){}document.getElementById('setup').style.display='none';phase='place';reset();status()};function p(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*1600/r.width,y:(e.clientY-r.top)*900/r.height}}function lock(){smoke={x:q.x,y:q.y,t:0};placed.push({n,x:q.x,y:q.y,b:performance.now()});n++;fly=false;if(n===4){phase='done';hud.textContent='FAS 1 KLAR';setTimeout(()=>document.getElementById('done').style.display='grid',650)}else{reset();status()}}c.onpointerdown=e=>{if(phase!=='place')return;if(fly){lock();return}let z=p(e);if(Math.hypot(z.x-q.x,z.y-q.y)<80)drag=true};c.onpointermove=e=>{if(!drag)return;let z=p(e),dx=z.x-a.x,dy=z.y-a.y,d=Math.hypot(dx,dy);if(d>165){dx*=165/d;dy*=165/d}q.x=a.x+dx;q.y=a.y+dy};c.onpointerup=()=>{if(!drag)return;drag=false;let dx=a.x-q.x,dy=a.y-q.y;if(Math.hypot(dx,dy)<8){reset();return}q.x=a.x;q.y=a.y;q.vx=dx*6.8;q.vy=dy*6.8;fly=true};function ball(){let g=x.createRadialGradient(q.x-8,q.y-9,2,q.x,q.y,25);g.addColorStop(0,'#fff');g.addColorStop(.25,'#dffaff');g.addColorStop(.65,'#39aaff');g.addColorStop(1,'#173da8');x.fillStyle=g;x.beginPath();x.arc(q.x,q.y,25,0,Math.PI*2);x.fill()}function obj(o){let im=imgs[o.n],s=Math.min(150,50+(performance.now()-o.b)/4);if(im.complete)x.drawImage(im,o.x-s/2,o.y-s/2,s,s)}function puff(){if(!smoke)return;smoke.t+=.035;let al=1-smoke.t,r=35+smoke.t*100;x.save();x.globalAlpha=Math.max(0,al);x.fillStyle='#fff';for(let k=0;k<7;k++){let an=k*6.28/7;x.beginPath();x.arc(smoke.x+Math.cos(an)*r*.3,smoke.y+Math.sin(an)*r*.25,r*.3,0,6.28);x.fill()}x.restore();if(smoke.t>=1)smoke=null}function loop(t){let dt=Math.min(.025,(t-last)/1000);last=t;if(phase==='place'&&fly){q.vy+=1250*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.x<0||q.x>1600||q.y<0||q.y>900){reset();status()}}x.clearRect(0,0,1600,900);placed.forEach(obj);puff();if(phase==='place')ball();requestAnimationFrame(loop)}document.getElementById('battle').onclick=()=>{document.getElementById('done').style.display='none';phase='battle';hud.textContent='STRIDSFAS'};requestAnimationFrame(loop);</script></body></html>
